# Configuration for https://github.com/super-linter/super-linter
VALIDATE_ALL_CODEBASE: true
DEFAULT_BRANCH: main
# TypeScript is linted more strictly by the project's own ESLint 9 flat config,
# tsc --noEmit (via npm run build) and Prettier in the build-test CI job.
VALIDATE_TYPESCRIPT_ES: false
VALIDATE_TYPESCRIPT_STANDARD: false
VALIDATE_TYPESCRIPT_PRETTIER: false
# JavaScript (eslint.config.js) is covered by the project's own ESLint job.
VALIDATE_JAVASCRIPT_ES: false
VALIDATE_JAVASCRIPT_STANDARD: false
VALIDATE_JAVASCRIPT_PRETTIER: false
# The vocabulary/mistake datasets are intentionally repetitive literals.
VALIDATE_JSCPD: false
VALIDATE_NATURAL_LANGUAGE: false
FILTER_REGEX_EXCLUDE: .*(dist|coverage)/.*
