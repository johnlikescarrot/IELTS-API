name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with 100% coverage gate
        run: npm run test

      - name: Upload coverage report
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build and smoke-test the compiled package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test the compiled CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js --port 4010 --silent --host 127.0.0.1 &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:4010/health" > /tmp/health.json; then break; fi
            sleep 0.5
          done
          kill "${SERVER_PID}"
          cat /tmp/health.json
          grep -q '"status": 200' /tmp/health.json

  datasets:
    name: Verify dataset integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-derive the vocabulary dataset from the upstream workbook
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/zhengyishiming/IELTS/git/blobs/d66fded8b74057a96a677eb25d9b9f7b39965ce3" \
            -o /tmp/1-22yas.xlsx
          python3 scripts/extract_vocabulary.py /tmp/1-22yas.xlsx /tmp/vocabulary.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/vocabulary.json'))
          regenerated = json.load(open('/tmp/vocabulary.json'))
          assert committed == regenerated, 'data/vocabulary.json is out of date'
          print(f"dataset reproducible: {regenerated['meta']['words']} words")
          PY

      - name: Validate the JSON datasets
        run: |
          python3 - <<'PY'
          import json
          for name in ("vocabulary", "corpus", "practice-tests", "materials", "archive", "testcenter", "wordbanks"):
              json.load(open(f"data/{name}.json"))
          print("datasets are valid JSON")
          PY

      - name: Re-derive the mock-exam test-centre index from the upstream platform
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/wanli4473/yysd-testcenter/git/trees/HEAD?recursive=1" \
            -o /tmp/testcenter-tree.json
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get('GITHUB_TOKEN')
          blobs = {entry['path']: entry['sha'] for entry in json.load(
              open('/tmp/testcenter-tree.json'))['tree'] if entry.get('type') == 'blob'}
          for name, path in (
              ('manifest.json', 'library/manifest.json'),
              ('listening-taxonomy.json', 'library/listening-taxonomy.json'),
              ('reading-taxonomy.json', 'library/reading-taxonomy.json'),
              ('cambridge_scoring.py', 'scripts/cambridge_scoring.py'),
          ):
              headers = {'Accept': 'application/vnd.github.v3.raw'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(
                  f"https://api.github.com/repos/wanli4473/yysd-testcenter/git/blobs/{blobs[path]}",
                  headers=headers)
              with urllib.request.urlopen(request) as response, open(f"/tmp/{name}", 'wb') as out:
                  out.write(response.read())
          print("downloaded the 4 platform-generated blobs for the test-centre derivation")
          PY
          python3 scripts/extract_testcenter.py /tmp/manifest.json /tmp/listening-taxonomy.json \
            /tmp/reading-taxonomy.json /tmp/cambridge_scoring.py /tmp/testcenter-tree.json /tmp/testcenter.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/testcenter.json'))
          regenerated = json.load(open('/tmp/testcenter.json'))
          assert committed == regenerated, 'data/testcenter.json is out of date'
          print(f"test-centre index reproducible: {regenerated['stats']['catalog']['items']} papers")
          PY

      - name: Check the test-centre index for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'scripts')
          from extract_practice_tests import CANONICAL_TYPES
          from extract_testcenter import DIFFICULTY_MAP, SCENES, TYPE_MAP

          index = json.load(open('data/testcenter.json'))
          catalog, groups, volumes = index['catalog'], index['groups'], index['volumes']
          stats = index['stats']

          assert stats['catalog']['items'] == len(catalog) == stats['catalog']['manifestCount'], 'catalogue totals differ'
          assert len({item['id'] for item in catalog}) == len(catalog), 'duplicate catalogue identifiers'
          assert sum(stats['catalog']['byZone'].values()) == len(catalog), 'zone totals differ'
          assert sum(stats['catalog']['byPaper'].values()) == len(catalog), 'paper totals differ'
          assert stats['catalog']['cambridgePapers'] == sum(
              1 for item in catalog if item['paper'] in {'listening', 'reading', 'writing'}
          ), 'cambridge totals differ'
          from urllib.parse import unquote

          for item in catalog:
              assert item['sourcePath'] in unquote(item['sourceUrl']), item['id']
              assert len(item['sha1'] or '') == 40, item['id']

          assert len(volumes) == 19, 'holdings matrix incomplete'
          assert sum(1 for row in volumes if row['complete']) == 18, 'complete volumes differ'
          hosted = [
              item for item in catalog
              if item['paper'] in {'listening', 'reading', 'writing'}
          ]
          assert sum(row['papersTotal'] for row in volumes) == sum(
              1 for item in hosted if item['volume'] is not None
          ), 'holdings totals differ'
          # The two teacher-made secret sets sit outside the volume numbering.
          assert [item['id'] for item in hosted if item['volume'] is None] == [
              'secret-set-1-reading', 'secret-set-2-reading'
          ], 'unexpected papers without a Cambridge volume'
          for row in volumes:
              assert row['papersTotal'] == sum(row[paper]['papers'] for paper in ('listening', 'reading', 'writing')), row

          assert len(groups) == 1099, 'group totals differ'
          assert sum(stats['taxonomy'][p]['groups'] for p in ('listening', 'reading')) == len(groups), 'taxonomy totals differ'
          assert sum(g['questions'] for g in groups) == 5408, 'question totals differ'
          scene_slugs = {value[0] for paper in SCENES for value in SCENES[paper].values()}
          for group in groups:
              assert group['type'] in CANONICAL_TYPES, group['id']
              assert group['questions'] == group['qTo'] - group['qFrom'] + 1, group['id']
              assert group['difficulty'] is None or group['difficulty'] in set(DIFFICULTY_MAP.values()), group['id']
              assert group['scene'] is None or group['scene'] in scene_slugs, group['id']

          for table in ('listening', 'reading'):
              rows = index['scoring'][table]['rows']
              assert rows[0]['rawFrom'] == 39 and rows[0]['rawTo'] == 40, table
              assert rows[-1]['rawFrom'] == 0, table
              for above, below in zip(rows, rows[1:]):
                  assert below['rawTo'] == above['rawFrom'] - 1, (table, below)
              for row in rows:
                  assert row['level'], row

          print(
              f"test-centre index consistent: {len(catalog)} papers, {len(volumes)} volumes, "
              f"{len(groups)} tagged groups over {sum(g['questions'] for g in groups)} questions"
          )
          PY

      - name: Re-derive the word-bank concordance from the deployed learning system
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Iamdacai/ielts-vocab-system/git/trees/1f5ad56d664c56ae449dacc7618b6d7f23967a69?recursive=1" \
            -o /tmp/wordbanks-tree.json
          # The concordance needs only the live database (19 MB SQLite) and the
          # spaced-repetition engine source, fetched by blob SHA so the
          # derivation is pinned to the indexed commit. The extractor opens the
          # database immutable, so the raw blob bytes are authoritative; the
          # write-ahead log the repository ships beside it changes file-level
          # bytes only, never the derived concordance.
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get('GITHUB_TOKEN')
          blobs = {entry['path']: entry['sha'] for entry in json.load(
              open('/tmp/wordbanks-tree.json'))['tree'] if entry.get('type') == 'blob'}
          for name, path in (
              ('ielts_vocab.db', 'backend/ielts_vocab.db'),
              ('spaced-repetition-algorithm.js', 'backend/spaced-repetition-algorithm.js'),
          ):
              headers = {'Accept': 'application/vnd.github.v3.raw'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Iamdacai/ielts-vocab-system/git/blobs/{blobs[path]}",
                  headers=headers)
              with urllib.request.urlopen(request) as response, open(f'/tmp/{name}', 'wb') as out:
                  out.write(response.read())
          print("downloaded the 2 platform blobs for the word-bank derivation")
          PY
          python3 scripts/extract_wordbanks.py /tmp/ielts_vocab.db \
            /tmp/spaced-repetition-algorithm.js /tmp/wordbanks.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/wordbanks.json'))
          regenerated = json.load(open('/tmp/wordbanks.json'))
          assert committed == regenerated, 'data/wordbanks.json is out of date'
          print(f"word-bank concordance reproducible: {regenerated['stats']['distinctWords']} words")
          PY

      - name: Check the word-bank concordance for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import re

          index = json.load(open('data/wordbanks.json'))
          meta, banks, overlaps = index['meta'], index['banks'], index['overlaps']
          words, stats, cambridge = index['words'], index['stats'], index['cambridge']

          assert stats['rows'] == sum(bank['rows'] for bank in banks) == 47044, 'row totals differ'
          assert len(banks) == stats['banks'] == 7, 'bank totals differ'
          assert len({bank['id'] for bank in banks}) == len(banks), 'duplicate bank identifiers'
          assert stats['distinctWords'] == len(words) == 15930, 'word totals differ'
          for bank in banks:
              assert bank['distinctWords'] <= bank['rows'], bank['id']
              assert bank['withPhonetic'] <= bank['rows'], bank['id']
              assert bank['sourceWorkbook'].split('/')[-1] in bank['sourceUrl'], bank['id']
          for source in meta['sources'].values():
              assert re.fullmatch(r'[0-9a-f]{40}', source['sha1']), source
              assert source['path'] in source['sourceUrl'], source

          assert len(overlaps) == 21, 'overlap matrix incomplete'
          by_id = {bank['id']: bank for bank in banks}
          for row in overlaps:
              assert row['intersection'] <= min(by_id[row['a']]['distinctWords'], by_id[row['b']]['distinctWords']), row
              assert row['union'] >= max(by_id[row['a']]['distinctWords'], by_id[row['b']]['distinctWords']), row
              assert row['jaccard'] == round(row['intersection'] / row['union'], 4), row
          assert stats['identicalBankPairs'] == [
              {'a': 'toefl', 'b': 'compilation', 'distinctWords': 9735}
          ], 'identical-pair detection differs'

          ids = [word['id'] for word in words]
          assert len(set(ids)) == len(ids), 'duplicate word identifiers'
          assert ids == sorted(ids), 'word identifiers are not sequential'
          for word in words:
              assert word['bankCount'] == len(word['banks']), word['id']
          assert sum(row['words'] for row in stats['membershipDistribution']) == len(words), \
              'membership distribution differs'
          assert stats['wordsInAllBanks'] == 567, 'all-bank total differs'

          assert cambridge['cambridgeWords'] == 4174, 'Cambridge join total differs'
          assert cambridge['ielts']['inCambridge'] == 2153, 'IELTS coverage differs'
          assert sum(cambridge['membershipOfCambridgeWords'].values()) == 4174, 'membership join differs'
          for row in cambridge['banks']:
              assert row['words'] <= by_id[row['bank']]['distinctWords'], row

          collocations = index['collocations']
          headword_stats = collocations['stats']
          assert headword_stats['verbPairs'] + headword_stats['nounPairs'] == headword_stats['pairs'], 'pair totals differ'
          assert headword_stats['verbHeadwords'] + headword_stats['nounHeadwords'] == headword_stats['headwords'], 'headword totals differ'
          assert headword_stats['headwordsInCambridge'] <= headword_stats['headwords'], 'Cambridge headword total differs'
          assert len(collocations['headwords']) == headword_stats['headwords'], 'headword list differs'

          review = index['review']
          assert [step['minutes'] for step in review['intervals']] == [
              5, 30, 720, 1440, 2880, 5760, 10080, 21600
          ], 'review ladder differs'
          assert review['masteryRule']['correctStep'] == 5, 'mastery rule differs'
          assert review['masteryRule']['incorrectStep'] == -8, 'mastery rule differs'
          assert review['reviewWindow']['hours'] == 2, 'review window differs'

          speaking, writing = index['topics']['speaking'], index['topics']['writing']
          assert len(speaking) == stats['topics']['speaking'] == 26, 'speaking totals differ'
          assert len(writing) == stats['topics']['writing'] == 26, 'writing totals differ'
          for topic in speaking:
              assert topic['part'] in (1, 2, 3), topic['id']
              assert (topic['cueCard'] is not None) == (topic['part'] == 2), topic['id']
              assert topic['difficulty'] in ('easy', 'medium', 'hard'), topic['id']
              assert 0 <= topic['frequency'] <= 100, topic['id']
          for topic in writing:
              assert topic['taskType'] in ('task1-academic', 'task1-general', 'task2'), topic['id']
              assert (topic['chartType'] is not None) == (topic['taskType'] == 'task1-academic'), topic['id']
              assert topic['difficulty'] in ('easy', 'medium', 'hard'), topic['id']

          print(
              f"word-bank concordance consistent: {len(banks)} banks, {stats['rows']} rows, "
              f"{len(words)} words, {len(overlaps)} bank pairs, "
              f"{len(collocations['headwords'])} collocation headwords"
          )
          PY

      - name: Re-derive the study-materials index from the upstream tree
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Oxidaner/ielts/git/trees/main?recursive=1" \
            -o /tmp/materials-tree.json
          python3 scripts/extract_materials.py /tmp/materials-tree.json /tmp/materials.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/materials.json'))
          regenerated = json.load(open('/tmp/materials.json'))
          assert committed == regenerated, 'data/materials.json is out of date'
          print(f"materials index reproducible: {regenerated['stats']['indexedFiles']} files")
          PY

      - name: Re-derive the grey-literature archive index from the upstream tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/msneloy/IELTS/git/trees/HEAD?recursive=1" \
            -o /tmp/archive-tree.json
          # The text-derived statistics need only the ~4 MB of document blobs
          # (sample PDFs and assignment text files), fetched by blob SHA so the
          # derivation is pinned to the indexed commit.
          pip install --quiet pypdf==6.17.0
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ.get('GITHUB_TOKEN')
          index = json.load(open('data/archive.json'))
          needed = [
              item['path']
              for item in index['items']
              if item['collection'] == 'reading-samples' or item.get('role') in {
                  'essay', 'prompt-list', 'answer-material'}
          ]
          blobs = {entry['path']: entry['sha'] for entry in json.load(
              open('/tmp/archive-tree.json'))['tree'] if entry.get('type') == 'blob'}
          for path in needed:
              target = Path('/tmp/archive-source') / path
              target.parent.mkdir(parents=True, exist_ok=True)
              headers = {'Accept': 'application/vnd.github.v3.raw'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(
                  f"https://api.github.com/repos/msneloy/IELTS/git/blobs/{blobs[path]}",
                  headers=headers)
              with urllib.request.urlopen(request) as response, open(target, 'wb') as out:
                  out.write(response.read())
          print(f"downloaded {len(needed)} document blobs for the archive derivation")
          PY
          python3 scripts/extract_archive.py /tmp/archive-tree.json /tmp/archive-source /tmp/archive.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/archive.json'))
          regenerated = json.load(open('/tmp/archive.json'))
          assert committed == regenerated, 'data/archive.json is out of date'
          print(f"archive index reproducible: {regenerated['stats']['indexedFiles']} files")
          PY

      - name: Check the archive index for internal consistency
        run: |
          python3 - <<'PY'
          import json

          index = json.load(open('data/archive.json'))
          items, stats, volumes = index['items'], index['stats'], index['volumes']

          assert stats['indexedFiles'] == len(items), 'indexedFiles disagrees with items'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'
          assert sum(stats['byCollection'].values()) == len(items), 'collection totals differ'
          assert sum(stats['byFormat'].values()) == len(items), 'format totals differ'
          assert sum(stats['byMedia'].values()) == len(items), 'media totals differ'
          assert sum(stats['bySkill'].values()) == len(items), 'skill totals differ'
          assert stats['audioTracks'] == stats['byMedia']['audio'], 'audio totals differ'

          audio = [item for item in items if item['media'] == 'audio']
          assert sum(item['sizeBytes'] for item in audio) == stats['audioBytes'], 'audio bytes differ'
          assert stats['audioBytes'] <= stats['indexedBytes'], 'audio exceeds total bytes'

          cambridge = stats['cambridge']
          cambridge_items = [item for item in items if item['collection'] == 'cambridge-audio']
          assert cambridge['audioTracks'] == sum(
              1 for item in cambridge_items if item['media'] == 'audio'), 'cambridge tracks differ'
          assert len(volumes) == cambridge['volumesIndexed'] == 18, 'volume table incomplete'
          assert sum(1 for row in volumes if row['complete']) == cambridge['completeVolumes']
          for row in volumes:
              tracks = [item for item in cambridge_items if item['volume'] == row['volume']]
              assert sum(1 for item in tracks if item['media'] == 'audio') == row['audioTracks'], row
              assert sum(item['sizeBytes'] for item in tracks) == row['bytes'], row
              tests = sorted({item['test'] for item in tracks if item['test'] is not None})
              assert tests == (row['testNumbers'] or []), row
              assert (len(tests) if tests else None) == row['testsInferred'], row

          assignments = stats['assignments']
          essays = [item for item in items if item.get('role') == 'essay']
          assert len(essays) == assignments['essays'], 'essay totals differ'
          assert sum(assignments['essaysByLearner'].values()) == len(essays), 'learner totals differ'
          assert sum(assignments['essaysByTaskType'].values()) == len(essays), 'task totals differ'
          for essay in essays:
              assert essay['readability'] is not None, essay['id']
              assert essay['date'] is not None, essay['id']

          samples = [item for item in items if item['collection'] == 'reading-samples']
          assert len(samples) == stats['readingSamples']['files'] == 12, 'sample totals differ'
          assert sum(1 for item in samples if item['hasAnswerKey']) == stats['readingSamples']['withAnswerKey']
          for sample in samples:
              assert sample['questionType'] is not None, sample['id']
              assert sample['readability'] is not None, sample['id']

          print(
              f"archive index consistent: {len(items)} files, "
              f"{len(volumes)} volumes, {len(essays)} essays, {len(samples)} samples"
          )
          PY

      - name: Check the practice-test index for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'scripts')
          from extract_practice_tests import CANONICAL_TYPES, TYPE_ALIASES, normalise_type

          index = json.load(open('data/practice-tests.json'))
          items, stats = index['items'], index['stats']

          assert stats['indexedItems'] == len(items), 'indexedItems disagrees with items'
          assert sum(item['questions'] for item in items) == stats['questions'], 'question totals differ'
          assert sum(stats['questionTypes'].values()) == stats['questions'], 'type totals differ'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'

          for label, mapping in stats['rawLabels'].items():
              assert normalise_type(label) == mapping['canonical'], f'stale mapping for {label}'

          for item in items:
              assert sum(item['typeCounts'].values()) == item['questions'], item['id']
              assert sorted(item['typeCounts']) == item['questionTypes'], item['id']
              assert set(item['questionTypes']) <= set(CANONICAL_TYPES), item['id']
              assert item['sourcePath'] in item['sourceUrl'], item['id']
              assert len(item['sha1'] or '') == 40, item['id']
              if item['skill'] == 'listening':
                  assert item['readability'] is None, item['id']

          print(
              f"practice-test index consistent: {len(items)} items, "
              f"{stats['questions']} questions, "
              f"{len(TYPE_ALIASES)} aliases -> {len(CANONICAL_TYPES)} canonical types"
          )
          PY
