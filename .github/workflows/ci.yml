name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with 100% coverage gate
        run: npm run test

      - name: Upload coverage report
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build and smoke-test the compiled package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test the compiled CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js --port 4010 --silent --host 127.0.0.1 &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:4010/health" > /tmp/health.json; then break; fi
            sleep 0.5
          done
          kill "${SERVER_PID}"
          cat /tmp/health.json
          grep -q '"status": 200' /tmp/health.json

  datasets:
    name: Verify dataset integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-derive the vocabulary dataset from the upstream workbook
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/zhengyishiming/IELTS/git/blobs/d66fded8b74057a96a677eb25d9b9f7b39965ce3" \
            -o /tmp/1-22yas.xlsx
          python3 scripts/extract_vocabulary.py /tmp/1-22yas.xlsx /tmp/vocabulary.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/vocabulary.json'))
          regenerated = json.load(open('/tmp/vocabulary.json'))
          assert committed == regenerated, 'data/vocabulary.json is out of date'
          print(f"dataset reproducible: {regenerated['meta']['words']} words")
          PY

      - name: Re-derive the exam-recall index from the upstream collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/Oxidaner/ielts/git/trees/main?recursive=1" \
            -o /tmp/recall-tree.json
          mkdir -p /tmp/recall-keys
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          token = os.environ["GH_TOKEN"]
          tree = json.loads(pathlib.Path("/tmp/recall-tree.json").read_text(encoding="utf-8"))
          blobs = {entry["path"]: entry for entry in tree["tree"] if entry["type"] == "blob"}

          def fetch(path, destination):
              blob = blobs[path]
              subprocess.run(
                  [
                      "curl",
                      "-fsSL",
                      "-H",
                      "Accept: application/vnd.github.v3.raw",
                      "-H",
                      f"Authorization: Bearer {token}",
                      blob["url"],
                      "-o",
                      destination,
                  ],
                  check=True,
              )

          fetch("口语/神奇题库.md", "/tmp/recall-bank.md")
          fetch("口语/2025年9-12月口语Part2按四大类分类新题+保留题.docx", "/tmp/recall-part2.docx")
          for path in blobs:
              name = pathlib.PurePosixPath(path).name
              if path.startswith("听力/听力/") and name.startswith("keys_") and name.endswith(".txt"):
                  fetch(path, f"/tmp/recall-keys/{name}")
          print("upstream exam-recall inputs fetched")
          PY
          python3 scripts/extract_exam_recall.py \
            /tmp/recall-tree.json /tmp/recall-bank.md /tmp/recall-part2.docx /tmp/recall-keys /tmp/exam-recall.json
          python3 - <<'PY'
          import json

          committed = json.load(open("data/exam-recall.json"))
          regenerated = json.load(open("/tmp/exam-recall.json"))
          assert committed == regenerated, "data/exam-recall.json is out of date"
          print(f"exam-recall dataset reproducible: {regenerated['stats']['indexedItems']} items")
          PY

      - name: Validate the JSON datasets
        run: |
          python3 -c "import json; json.load(open('data/vocabulary.json')); json.load(open('data/corpus.json')); json.load(open('data/practice-tests.json')); json.load(open('data/exam-recall.json')); print('datasets are valid JSON')"

      - name: Check the practice-test index for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'scripts')
          from extract_practice_tests import CANONICAL_TYPES, TYPE_ALIASES, normalise_type

          index = json.load(open('data/practice-tests.json'))
          items, stats = index['items'], index['stats']

          assert stats['indexedItems'] == len(items), 'indexedItems disagrees with items'
          assert sum(item['questions'] for item in items) == stats['questions'], 'question totals differ'
          assert sum(stats['questionTypes'].values()) == stats['questions'], 'type totals differ'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'

          for label, mapping in stats['rawLabels'].items():
              assert normalise_type(label) == mapping['canonical'], f'stale mapping for {label}'

          for item in items:
              assert sum(item['typeCounts'].values()) == item['questions'], item['id']
              assert sorted(item['typeCounts']) == item['questionTypes'], item['id']
              assert set(item['questionTypes']) <= set(CANONICAL_TYPES), item['id']
              assert item['sourcePath'] in item['sourceUrl'], item['id']
              assert len(item['sha1'] or '') == 40, item['id']
              if item['skill'] == 'listening':
                  assert item['readability'] is None, item['id']

          print(
              f"practice-test index consistent: {len(items)} items, "
              f"{stats['questions']} questions, "
              f"{len(TYPE_ALIASES)} aliases -> {len(CANONICAL_TYPES)} canonical types"
          )
          PY

      - name: Check the exam-recall index for internal consistency
        run: |
          python3 - <<'PY'
          import json

          index = json.load(open("data/exam-recall.json"))
          items, stats = index["items"], index["stats"]

          assert stats["indexedItems"] == len(items), "indexedItems disagrees with items"
          assert len({item["id"] for item in items}) == len(items), "duplicate identifiers"
          for skill, expected in stats["bySkill"].items():
              assert sum(1 for item in items if item["skill"] == skill) == expected, skill
          assert sum(1 for item in items if item["kind"] == "speaking-cue-card") == stats["speaking"]["cueCards"]
          assert sum(1 for item in items if item["kind"] == "speaking-topic") == stats["speaking"]["part1Topics"]
          assert (
              sum(item["questions"] or 0 for item in items if item["kind"] == "speaking-topic")
              == stats["speaking"]["part1Questions"]
          )
          assert sum(1 for item in items if item["kind"] == "reading-article") == stats["reading"]["articles"]
          assert sum(1 for item in items if item["kind"] == "listening-test") == stats["listening"]["testSets"]
          assert (
              sum(item["questions"] or 0 for item in items if item["kind"] == "listening-test")
              == stats["listening"]["answers"]
          )
          for item in items:
              assert item["sourceUrl"].startswith("https://github.com/Oxidaner/ielts/blob/main/"), item["id"]
              assert len(item["sha1"] or "") == 40, item["id"]
          print(f"exam-recall index consistent: {len(items)} items")
          PY
