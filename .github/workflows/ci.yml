name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with 100% coverage gate
        run: npm run test

      - name: Upload coverage report
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build and smoke-test the compiled package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test the compiled CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js --port 4010 --silent --host 127.0.0.1 &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:4010/health" > /tmp/health.json; then break; fi
            sleep 0.5
          done
          kill "${SERVER_PID}"
          cat /tmp/health.json
          grep -q '"status": 200' /tmp/health.json

  datasets:
    name: Verify dataset integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-derive the vocabulary dataset from the upstream workbook
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/zhengyishiming/IELTS/git/blobs/d66fded8b74057a96a677eb25d9b9f7b39965ce3" \
            -o /tmp/1-22yas.xlsx
          python3 scripts/extract_vocabulary.py /tmp/1-22yas.xlsx /tmp/vocabulary.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/vocabulary.json'))
          regenerated = json.load(open('/tmp/vocabulary.json'))
          assert committed == regenerated, 'data/vocabulary.json is out of date'
          print(f"dataset reproducible: {regenerated['meta']['words']} words")
          PY

      # The study-skill datasets are derived from pinned blobs of the
      # Oxidaner/ielts study-material collection (commit 738c6082):
      # paraphrase handout, scenario handout, writing-recall workbook,
      # speaking deck and speaking bank. A moved or edited upstream file
      # fails loudly here, which is the point: the committed datasets must
      # stay byte-reproducible from their sources.
      - name: Re-derive the study-skill datasets from the upstream collection
        run: |
          fetch_blob() {
            curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Oxidaner/ielts/git/blobs/$1" -o "$2"
          }
          fetch_blob ffb74719ca2294780fc8ab8933e9f35a9e4502a2 /tmp/paraphrases.pdf
          fetch_blob 54f3b0c8bf5ca55fe0b8e1cfac15a436938901e8 /tmp/scenarios.pdf
          fetch_blob a0ded41f6b50a487d6ac4f6cd4dab34b33b9a1fa /tmp/writing-recall.xlsx
          fetch_blob 087a2e478ee712ab86a910686b3b1125d388bb79 /tmp/speaking-deck.docx
          fetch_blob 28a27e2e827e9536d75546c5d15b1a3ed713b12d /tmp/speaking-bank.md
          python3 scripts/extract_listening_words.py /tmp/paraphrases.pdf /tmp/scenarios.pdf /tmp/listening-words.json
          python3 scripts/extract_writing_recall.py /tmp/writing-recall.xlsx /tmp/writing-recall.json
          python3 scripts/extract_speaking_bank.py /tmp/speaking-deck.docx /tmp/speaking-bank.md /tmp/speaking-bank.json
          python3 - <<'PY'
          import json
          for name in ('listening-words', 'writing-recall', 'speaking-bank'):
              committed = json.load(open(f'data/{name}.json'))
              regenerated = json.load(open(f'/tmp/{name}.json'))
              assert committed == regenerated, f'data/{name}.json is out of date'
              print(f'{name}.json reproducible')
          PY

      - name: Regenerate the OpenAPI document and verify it is current
        run: |
          npm ci
          npx tsx scripts/gen-openapi.mts
          git diff --exit-code docs/openapi.json || {
            echo '::error::docs/openapi.json is stale; run `npx tsx scripts/gen-openapi.mts` and commit'
            git diff docs/openapi.json | head -40
            exit 1
          }

      - name: Validate the JSON datasets
        run: |
          python3 - <<'PY'
          import json

          datasets = (
              'vocabulary', 'corpus', 'practice-tests',
              'listening-words', 'writing-recall', 'speaking-bank',
          )
          for name in datasets:
              json.load(open(f'data/{name}.json'))
          print(f'{len(datasets)} datasets are valid JSON')
          PY

      - name: Check the practice-test index for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'scripts')
          from extract_practice_tests import CANONICAL_TYPES, TYPE_ALIASES, normalise_type

          index = json.load(open('data/practice-tests.json'))
          items, stats = index['items'], index['stats']

          assert stats['indexedItems'] == len(items), 'indexedItems disagrees with items'
          assert sum(item['questions'] for item in items) == stats['questions'], 'question totals differ'
          assert sum(stats['questionTypes'].values()) == stats['questions'], 'type totals differ'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'

          for label, mapping in stats['rawLabels'].items():
              assert normalise_type(label) == mapping['canonical'], f'stale mapping for {label}'

          for item in items:
              assert sum(item['typeCounts'].values()) == item['questions'], item['id']
              assert sorted(item['typeCounts']) == item['questionTypes'], item['id']
              assert set(item['questionTypes']) <= set(CANONICAL_TYPES), item['id']
              assert item['sourcePath'] in item['sourceUrl'], item['id']
              assert len(item['sha1'] or '') == 40, item['id']
              if item['skill'] == 'listening':
                  assert item['readability'] is None, item['id']

          print(
              f"practice-test index consistent: {len(items)} items, "
              f"{stats['questions']} questions, "
              f"{len(TYPE_ALIASES)} aliases -> {len(CANONICAL_TYPES)} canonical types"
          )
          PY
