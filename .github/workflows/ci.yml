name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with 100% coverage gate
        run: npm run test

      - name: Upload coverage report
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build and smoke-test the compiled package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test the compiled CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js --port 4010 --silent --host 127.0.0.1 &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:4010/health" > /tmp/health.json; then break; fi
            sleep 0.5
          done
          kill "${SERVER_PID}"
          cat /tmp/health.json
          grep -q '"status": 200' /tmp/health.json

  datasets:
    name: Verify dataset integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-derive the vocabulary dataset from the upstream workbook
        run: |
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/zhengyishiming/IELTS/git/blobs/d66fded8b74057a96a677eb25d9b9f7b39965ce3" \
            -o /tmp/1-22yas.xlsx
          python3 scripts/extract_vocabulary.py /tmp/1-22yas.xlsx /tmp/vocabulary.json
          python3 - <<'PY'
          import json
          committed = json.load(open('data/vocabulary.json'))
          regenerated = json.load(open('/tmp/vocabulary.json'))
          assert committed == regenerated, 'data/vocabulary.json is out of date'
          print(f"dataset reproducible: {regenerated['meta']['words']} words")
          PY

      - name: Validate the JSON datasets
        run: |
          python3 -c "import json; json.load(open('data/vocabulary.json')); json.load(open('data/corpus.json')); json.load(open('data/practice-tests.json')); json.load(open('data/study-notes.json')); json.load(open('data/collocations.json')); print('datasets are valid JSON')"

      - name: Re-derive the study-notes and collocation datasets from upstream
        run: |
          curl -sL "https://api.github.com/repos/Oxidaner/ielts/git/trees/main?recursive=1" -o /tmp/notes-tree.json
          mkdir -p "/tmp/notes-checkout/口语"
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/Oxidaner/ielts/git/blobs/71b3d5039aa49bf41ebb323e17500489ba44e161" \
            -o "/tmp/notes-checkout/口语/口语part 3方法论.md"
          curl -fsSL -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/Oxidaner/ielts/git/blobs/28a27e2e827e9536d75546c5d15b1a3ed713b12d" \
            -o "/tmp/notes-checkout/口语/神奇题库.md"
          python3 scripts/extract_study_notes.py /tmp/notes-tree.json /tmp/notes-checkout /tmp/study-notes.json
          python3 scripts/extract_collocations.py "/tmp/notes-checkout/口语/口语part 3方法论.md" /tmp/collocations.json
          python3 - <<'PY'
          import json

          for name, committed, regenerated in (
              ("study-notes", "data/study-notes.json", "/tmp/study-notes.json"),
              ("collocations", "data/collocations.json", "/tmp/collocations.json"),
          ):
              left = json.load(open(committed, encoding="utf-8"))
              right = json.load(open(regenerated, encoding="utf-8"))
              assert left == right, f"data/{name}.json is out of date"
              print(f"{name} reproducible: {right['stats']}")
          PY

      - name: Check the study-notes and collocation indexes for internal consistency
        run: |
          python3 - <<'PY'
          import json

          notes = json.load(open('data/study-notes.json', encoding='utf-8'))
          items, stats = notes['items'], notes['stats']
          assert stats['indexedFiles'] == len(items), 'indexedFiles disagrees with items'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'
          assert items == sorted(items, key=lambda item: item['path']), 'items not in path order'
          assert sum(stats['bySkill'].values()) == len(items), 'skill totals differ'
          assert sum(stats['byCategory'].values()) == len(items), 'category totals differ'
          assert sum(stats['byFormat'].values()) == len(items), 'format totals differ'
          bank = stats['speakingBank']
          assert bank['questions'] == bank['part1Questions'] + bank['part3FollowUpQuestions']
          for item in items:
              assert item['path'].replace(' ', '%20') in item['sourceUrl'], item['id']
              assert len(item['sha1'] or '') == 40, item['id']

          bank_items = json.load(open('data/collocations.json', encoding='utf-8'))
          entries, cstats = bank_items['items'], bank_items['stats']
          assert cstats['phrases'] == len(entries), 'phrases disagrees with items'
          assert len({entry['id'] for entry in entries}) == len(entries), 'duplicate identifiers'
          assert sum(cstats['byDimension'].values()) == len(entries), 'dimension totals differ'
          assert sum(cstats['byPolarity'].values()) == len(entries), 'polarity totals differ'
          assert sum(cstats['byKind'].values()) == len(entries), 'kind totals differ'
          assert len(bank_items['dimensions']) == cstats['dimensions'], 'catalogue disagrees'
          for entry in entries:
              assert entry['dimension'] in {d['id'] for d in bank_items['dimensions']}, entry['id']
              assert len(entry['phrase']) > 1, entry['id']

          print(
              f"indexes consistent: {len(items)} study-note files, "
              f"{len(entries)} collocations across {cstats['dimensions']} dimensions"
          )
          PY

      - name: Check the practice-test index for internal consistency
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'scripts')
          from extract_practice_tests import CANONICAL_TYPES, TYPE_ALIASES, normalise_type

          index = json.load(open('data/practice-tests.json'))
          items, stats = index['items'], index['stats']

          assert stats['indexedItems'] == len(items), 'indexedItems disagrees with items'
          assert sum(item['questions'] for item in items) == stats['questions'], 'question totals differ'
          assert sum(stats['questionTypes'].values()) == stats['questions'], 'type totals differ'
          assert len({item['id'] for item in items}) == len(items), 'duplicate identifiers'

          for label, mapping in stats['rawLabels'].items():
              assert normalise_type(label) == mapping['canonical'], f'stale mapping for {label}'

          for item in items:
              assert sum(item['typeCounts'].values()) == item['questions'], item['id']
              assert sorted(item['typeCounts']) == item['questionTypes'], item['id']
              assert set(item['questionTypes']) <= set(CANONICAL_TYPES), item['id']
              assert item['sourcePath'] in item['sourceUrl'], item['id']
              assert len(item['sha1'] or '') == 40, item['id']
              if item['skill'] == 'listening':
                  assert item['readability'] is None, item['id']

          print(
              f"practice-test index consistent: {len(items)} items, "
              f"{stats['questions']} questions, "
              f"{len(TYPE_ALIASES)} aliases -> {len(CANONICAL_TYPES)} canonical types"
          )
          PY
