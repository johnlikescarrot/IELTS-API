name: release

# A GitHub release is not itself a Zenodo deposit. After enabling the Zenodo
# integration, verify that archiving succeeds and update CITATION.cff manually
# with the real version DOI. Never publish placeholder identifiers.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the release
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Generate and verify archival documentation
        run: |
          npm run docs:generate
          git diff --exit-code -- docs/openapi.json docs/research.html

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            README.md CITATION.cff codemeta.json .zenodo.json DATA-LICENSE \
            docs/openapi.json docs/research.html data/practice.json
