name: release

# Cutting a tag publishes a citable, archived release. Zenodo mints a DOI for
# every tag once the repository is enabled there. Maintainers must verify the
# public record and update CITATION.cff themselves; this workflow does not mint a DOI.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and publish the release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the release
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Export research artifacts without starting a server
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import { API_VERSION, DOMAIN_ROUTES, READING_DATASET, openApiDocument, readingEntry, searchReading } from './dist/index.js';
          const writeJson = (path, data) => writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          writeJson('docs/openapi.json', openApiDocument(DOMAIN_ROUTES, '/', API_VERSION));
          writeJson('reading-practice.json', { meta: READING_DATASET, entries: searchReading().map(({ id }) => readingEntry(id)) });
          JS

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            README.md CITATION.cff codemeta.json .zenodo.json DATA-LICENSE \
            docs/openapi.json reading-practice.json
