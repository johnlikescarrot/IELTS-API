name: release

# A maintainer-created tag can publish a GitHub release after verification.
# Zenodo archiving requires a separately configured integration and a confirmed
# record. This workflow does not mint a DOI or modify CITATION.cff automatically.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the release
        run: npm run validate

      - name: Verify generated artifacts
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            README.md CITATION.cff codemeta.json .zenodo.json DATA-LICENSE \
            docs/openapi.json docs/citation.bib paper/practice-metadata.md
