name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # super-linter runs ESLint from the workspace. Without the project's
      # dependencies present it silently falls back to its own bundled rules,
      # which is not the configuration this repository is written against.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run super-linter
        id: lint
        uses: super-linter/super-linter/slim@v8.3.1
        env:
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them. Anchored so that
          # src/data/ and test/data/ — which are hand-written source — stay linted.
          FILTER_REGEX_EXCLUDE: ^/?(github/workspace/)?(data|coverage|dist|node_modules)/.*$
          IGNORE_GITIGNORED_FILES: true
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Keep the findings as files so the report step below can read them.
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Linter configuration files.
          LINTER_RULES_PATH: /
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          # super-linter looks for `eslint.config.mjs` by default and silently falls
          # back to its own bundled rules when it is missing, so name the real file.
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Findings go into the job summary, and onto the pull request when the run
      # fails, because Actions logs are awkward to read and easy to lose.
      - name: Report findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          report=super-linter-report.md
          {
            echo '## super-linter'
            echo
            if [ -f super-linter-output/super-linter-summary.md ]; then
              cat super-linter-output/super-linter-summary.md
            else
              echo 'super-linter produced no summary.'
            fi
            if [ "${LINT_OUTCOME}" != "success" ]; then
              echo
              for log in super-linter-output/super-linter/super-linter-parallel-stdout-*; do
                [ -s "${log}" ] || continue
                echo "<details><summary>$(basename "${log}")</summary>"
                echo
                echo '```text'
                tail -c 20000 "${log}"
                echo '```'
                echo
                echo '</details>'
                echo
              done
            fi
          } > "${report}"
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${PR_NUMBER}" ] && [ "${LINT_OUTCOME}" != "success" ]; then
            gh pr comment "${PR_NUMBER}" --body-file "${report}" --repo "${GITHUB_REPOSITORY}"
          fi
