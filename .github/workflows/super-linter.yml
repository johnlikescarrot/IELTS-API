---
name: Super-Linter

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  super-lint:
    name: Lint code base with Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Super-Linter
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # The ESLint-based validators are disabled here because Super-Linter's
          # bundled ESLint 8.57.1 crashes while loading its own .eslintrc.yml
          # under Node ESM. TypeScript/JavaScript linting is enforced instead by
          # the dedicated CI workflow (npm run lint), which already runs ESLint 9
          # with the project's flat config and passes.
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_TSX: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_BASH: false
          VALIDATE_DOCKERFILE: false
          VALIDATE_JSCPD: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_SHELL_SHFMT: false
          FILTER_REGEX_EXCLUDE: '(dist/|node_modules/|coverage/|package-lock\.json)'
