name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Needed so the run can attach its diagnostic output as an artifact.
  actions: read
  # Needed so a failing run can report which files failed, on the pull request.
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # super-linter runs this repository's own flat ESLint config, which
      # imports `typescript-eslint` and `@eslint/js` from `node_modules`. The
      # linter image does not install project dependencies, so without this
      # step every TypeScript file fails to lint with a resolution error.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run super-linter
        uses: super-linter/super-linter/slim@v8.3.1
        env:
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          FILTER_REGEX_EXCLUDE: .*(data/|coverage/|dist/).*
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Keep the full log so a failure can be diagnosed from the artifact.
          SAVE_SUPER_LINTER_OUTPUT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          CREATE_LOG_FILE: true
          LOG_FILE: super-linter.log
          # Linter configuration files live at the workspace root, next to the
          # configs they belong to (`.`, not `/`: with `/` super-linter never
          # finds `eslint.config.js` and silently falls back to its own
          # bundled defaults — which enforce eslint-plugin-n rules this repo
          # deliberately does not use).
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          CHECKOV_FILE_NAME: .checkov.yaml
          YAML_CONFIG_FILE: .yamllint.yml
          ESLINT_USE_FLAT_CONFIG: true
          # ESLint's own default filename is eslint.config.mjs; this repo uses
          # eslint.config.js. Without these two overrides super-linter finds no
          # config, falls back to the bundled one (which enables
          # eslint-plugin-n rules the repo deliberately does not adopt).
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the failures on the job summary and the pull request
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          report="${RUNNER_TEMP}/super-linter-report.md"
          {
            echo '## super-linter findings'
            echo
            echo '<details><summary>artefacts produced by the run</summary>'
            echo
            echo '```text'
            ls -laR super-linter-output 2>&1 | head -100
            ls -la super-linter.log 2>&1
            echo '```'
            echo
            echo '</details>'
            echo
            while IFS= read -r file; do
              echo "<details><summary>${file}</summary>"
              echo
              echo '```text'
              tail -c 15000 "${file}" 2>&1
              echo '```'
              echo
              echo '</details>'
              echo
            done < <(find . -maxdepth 3 \( -name 'super-linter*.log' -o -name '*summary*.md' \) -type f 2>/dev/null | head -20)
          } > "${report}" 2>&1
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${PR_NUMBER}" ]; then
            gh pr comment "${PR_NUMBER}" --body-file "${report}"
          fi
          exit 0

      - name: Upload the super-linter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-output
          path: super-linter-output/
          retention-days: 7
          if-no-files-found: ignore
