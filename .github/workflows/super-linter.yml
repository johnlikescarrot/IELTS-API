name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.
#
# The job runs the official super-linter container (the documented container
# usage). This is equivalent to the `uses:` action form but keeps GitHub
# context variables, the repo-root linter configurations and a readable
# failure report (emitted as check annotations) under our control.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPER_LINTER_IMAGE: ghcr.io/super-linter/super-linter:slim-v8.3.1

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run super-linter
        id: lint
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "DEFAULT_BRANCH=main"
            echo "DEFAULT_WORKSPACE=/tmp/lint"
            echo "VALIDATE_ALL_CODEBASE=true"
            # The generated datasets are machine-written: never lint them.
            echo "FILTER_REGEX_EXCLUDE=.*(data/|coverage/|dist/).*"
            # Languages enabled for this repository.
            echo "VALIDATE_JAVASCRIPT_ES=true"
            echo "VALIDATE_TYPESCRIPT_ES=true"
            echo "VALIDATE_JSON=true"
            echo "VALIDATE_YAML=true"
            echo "VALIDATE_MARKDOWN=true"
            echo "VALIDATE_DOCKERFILE_HADOLINT=true"
            echo "VALIDATE_BASH=true"
            echo "VALIDATE_BASH_EXEC=true"
            echo "VALIDATE_GITHUB_ACTIONS=true"
            echo "VALIDATE_EDITORCONFIG=true"
            echo "VALIDATE_ENV=true"
            echo "VALIDATE_GITLEAKS=true"
            echo "VALIDATE_CHECKOV=true"
            # Linter configuration files, all committed at the repository root
            # and mounted at /tmp/lint.
            echo "LINTER_RULES_PATH=/tmp/lint"
            echo "MARKDOWN_CONFIG_FILE=.markdown-lint.yml"
            echo "YAML_CONFIG_FILE=.yamllint.yml"
            echo "ESLINT_CONFIG_FILE=eslint.config.js"
            echo "ESLINT_USE_FLAT_CONFIG=true"
          } > /tmp/super-linter.env
          status=0
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/tmp/lint" \
            --volume "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            --env-file /tmp/super-linter.env \
            -e "GITHUB_TOKEN=$GITHUB_TOKEN" \
            -e "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            -e "GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER" \
            -e "GITHUB_API_URL=$GITHUB_API_URL" \
            -e "GITHUB_SERVER_URL=$GITHUB_SERVER_URL" \
            -e "GITHUB_SHA=$GITHUB_SHA" \
            -e "GITHUB_REF=$GITHUB_REF" \
            -e "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            -e "GITHUB_EVENT_PATH=/github/event.json" \
            "$SUPER_LINTER_IMAGE" \
            > /tmp/super-linter.log 2>&1 || status=1
          if grep -qE "Failed linting|failed validation" /tmp/super-linter.log; then status=1; fi
          echo "super-linter exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Surface the failure through check-run annotations: they are
            # available through the Checks API even when the raw job log is
            # not reachable.
            {
              grep -nE "FATAL|fatal|Unable|dubious|Error|error while|not found|denied" /tmp/super-linter.log | head -n 10
              echo "---- log size: $(wc -l < /tmp/super-linter.log) lines; last 20 ----"
              tail -n 20 /tmp/super-linter.log
            } | sed -e '/\[[A-Z_]*\]/d' \
              | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' \
              | while IFS= read -r line; do
                  echo "::error title=super-linter::$line"
                done
          else
            echo "super-linter passed: $(grep -cE 'Linted \[' /tmp/super-linter.log) file groups linted" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "## super-linter (slim-v8.3.1)"
            echo
            if grep -qE "Failed linting|failed validation|ERROR" /tmp/super-linter.log; then
              echo '**Failing lines:**'
              echo '```'
              grep -nE "ERROR|Failed to validate|failed validation|Violations" /tmp/super-linter.log | tail -n 40
              echo '```'
            else
              echo 'All enabled linters passed on every file.'
            fi
            echo
            echo '<details><summary>Last log lines</summary>'
            echo
            echo '```'
            tail -n 30 /tmp/super-linter.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
