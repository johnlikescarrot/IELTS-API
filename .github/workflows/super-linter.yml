name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the report step explain a failing run right on the pull request.
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run super-linter
        uses: super-linter/super-linter/slim@v8.3.1
        env:
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          FILTER_REGEX_EXCLUDE: .*(data/|coverage/|dist/).*
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Linter configuration files.
          LINTER_RULES_PATH: /
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          ESLINT_USE_FLAT_CONFIG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Machine-readable report in the workspace; posted by the next step.
          OUTPUT_FORMAT: markdown
          OUTPUT_FILE: .super-linter-report.md

      - name: Publish the linting report on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f .super-linter-report.md ]; then
            head -c 60000 .super-linter-report.md > /tmp/report.md
          else
            printf '%s\n' 'super-linter failed before writing a report; see the step log.' > /tmp/report.md
          fi
          {
            printf '%s\n' '## super-linter report'
            printf '%s\n' ''
            cat /tmp/report.md
          } > /tmp/report-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report-comment.md
