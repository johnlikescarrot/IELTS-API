name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.
#
# The job runs the official super-linter container directly (the documented
# "run it inside a container" usage). This is equivalent to the `uses:` form
# but lets the job publish a readable diagnostic in the step summary even when
# the raw Actions log is not reachable.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write super-linter configuration
        run: |
          {
            echo "DEFAULT_BRANCH=main"
            echo "DEFAULT_WORKSPACE=/tmp/lint"
            echo "VALIDATE_ALL_CODEBASE=true"
            # The generated datasets are machine-written: never lint them.
            echo "FILTER_REGEX_EXCLUDE=.*(data/|coverage/|dist/).*"
            # Languages enabled for this repository.
            echo "VALIDATE_JAVASCRIPT_ES=true"
            echo "VALIDATE_TYPESCRIPT_ES=true"
            echo "VALIDATE_JSON=true"
            echo "VALIDATE_YAML=true"
            echo "VALIDATE_MARKDOWN=true"
            echo "VALIDATE_DOCKERFILE_HADOLINT=true"
            echo "VALIDATE_BASH=true"
            echo "VALIDATE_BASH_EXEC=true"
            echo "VALIDATE_GITHUB_ACTIONS=true"
            echo "VALIDATE_EDITORCONFIG=true"
            echo "VALIDATE_ENV=true"
            echo "VALIDATE_GITLEAKS=true"
            echo "VALIDATE_CHECKOV=true"
            # Deliberately disabled: the code base is TypeScript-only and the
            # extraction scripts are standalone Python utilities with their own
            # formatting.
            # Linter configuration files, all committed at the repository root
            # and mounted at /tmp/lint.
            echo "LINTER_RULES_PATH=/tmp/lint"
            echo "MARKDOWN_CONFIG_FILE=.markdown-lint.yml"
            echo "YAML_CONFIG_FILE=.yamllint.yml"
            echo "ESLINT_CONFIG_FILE=eslint.config.js"
            echo "ESLINT_USE_FLAT_CONFIG=true"
          } > /tmp/super-linter.env

      - name: Run super-linter
        id: lint
        shell: bash
        run: |
          status=0
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/tmp/lint" \
            --env-file /tmp/super-linter.env \
            ghcr.io/super-linter/super-linter:slim-v8.3.1 \
            > /tmp/super-linter.log 2>&1 || status=1
          grep -qE "Failed linting|failed validation" /tmp/super-linter.log && status=1
          echo "super-linter exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Surface the failure through check-run annotations: they are
            # available through the Checks API even when the raw job log is
            # not reachable.
            grep -nE "ERROR|WARNING.*failed|Failed to validate|failed validation|❌" /tmp/super-linter.log \
              | head -n 25 \
              | sed -e 's/%/%25/g' -e 's/:/%3A/g' \
              | while IFS= read -r line; do
                  echo "::error title=super-linter::$line"
                done
          fi
          exit "$status"

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "## super-linter (slim-v8.3.1)"
            echo
            if grep -qE "Failed linting|failed validation" /tmp/super-linter.log; then
              echo '**Failure details (per-linter):**'
              echo '```'
              grep -E "Failed to lint|ERROR.*lint|Errors while running" /tmp/super-linter.log | tail -n 60
              echo '```'
            else
              echo 'All enabled linters passed on every file.'
              grep -E "Linted|passed validation" /tmp/super-linter.log | tail -n 25 || true
            fi
            echo
            echo '<details><summary>Last log lines</summary>'
            echo
            echo '```'
            tail -n 25 /tmp/super-linter.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
