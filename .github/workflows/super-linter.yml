name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # super-linter 8 runs ESLint against this repository's own flat config
      # (eslint.config.js), which imports @eslint/js, typescript-eslint and
      # eslint-config-prettier. Those have to be resolvable inside the workspace
      # or ESLint cannot load the configuration at all.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies for the project-local ESLint configuration
        run: npm ci

      - name: Run super-linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written, and node_modules is only
          # present so that ESLint can resolve the flat config: never lint them.
          FILTER_REGEX_EXCLUDE: .*(data/|coverage/|dist/|node_modules/).*
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Linter configuration files.
          LINTER_RULES_PATH: /
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          CREATE_LOG_FILE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The container can move a root-owned mktemp file (mode 0600) into the
      # workspace. Give the host runner access before reading or archiving it;
      # otherwise an upload failure hides the actual lint finding.
      - name: Make the container diagnostic log readable
        if: failure()
        run: |
          if sudo test -f super-linter.log && ! test -L super-linter.log; then
            sudo chown --no-dereference "$(id -u):$(id -g)" super-linter.log
          fi
          ls -ln super-linter.log 2>/dev/null || true

      # Keep the linter log when the job fails: it is the only place that
      # records which linter complained and why. The annotations below
      # surface the finding even when the log artifact cannot be uploaded
      # (a runner-side zip failure would otherwise mask the real errors).
      - name: Surface super-linter errors as annotations
        if: failure()
        run: |
          set +e
          size=$(wc -c < super-linter.log 2>/dev/null)
          echo "::error title=super-linter log::super-linter.log is ${size:-missing} bytes; tail follows"
          grep -F '[ERROR]' super-linter.log 2>/dev/null | head -8 | while IFS= read -r line; do
            message=$(printf '%s' "$line" | cut -c1-450)
            echo "::error title=super-linter::${message}"
          done
          tail -n 8 super-linter.log 2>/dev/null | while IFS= read -r line; do
            message=$(printf '%s' "$line" | cut -c1-450)
            echo "::error title=super-linter tail::${message}"
          done

      - name: Upload the super-linter log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-log
          path: super-linter.log
          if-no-files-found: ignore
          retention-days: 7
