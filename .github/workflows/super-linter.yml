name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Install project lint configuration dependencies
        run: npm ci

      - name: Run super-linter
        uses: super-linter/super-linter/slim@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        env:
          CREATE_LOG_FILE: true
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          FILTER_REGEX_EXCLUDE: '(^|/)data/(corpus|vocabulary|practice)\.json$|(^|/)(node_modules|coverage|dist)/'
          IGNORE_GITIGNORED_FILES: true
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Linter configuration files.
          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          ESLINT_USE_FLAT_CONFIG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface lint failures in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('super-linter.log')
          if log.exists():
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              selected = set()
              for index, line in enumerate(lines):
                  if '[ERROR]' in line or '[FATAL]' in line:
                      selected.update(range(max(0, index - 2), min(len(lines), index + 45)))
              message = '\n'.join(lines[index] for index in sorted(selected))[:60000]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if message:
                  print(f'::error title=Super-Linter diagnostics::{message}')
          PY
