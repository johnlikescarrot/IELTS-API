name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Needed so the run can attach its diagnostic output as an artifact.
  actions: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # super-linter runs this repository's own flat ESLint config, which
      # imports `typescript-eslint` and `@eslint/js` from `node_modules`. The
      # linter image does not install project dependencies, so without this
      # step every TypeScript file fails to lint with a resolution error.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run super-linter
        uses: super-linter/super-linter/slim@v8.3.1
        env:
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          FILTER_REGEX_EXCLUDE: .*(data/|coverage/|dist/).*
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Keep the full log so a failure can be diagnosed from the artifact.
          SAVE_SUPER_LINTER_OUTPUT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          # Linter configuration files (paths are relative to the workspace).
          LINTER_RULES_PATH: /
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          ESLINT_USE_FLAT_CONFIG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the super-linter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-output
          path: super-linter-output/
          retention-days: 7
          if-no-files-found: ignore
