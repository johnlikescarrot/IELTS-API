---
name: Super-Linter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

jobs:
  super-linter:
    name: Lint everything
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          DEFAULT_BRANCH: main
          SAVE_SUPER_LINTER_OUTPUT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FILTER_REGEX_EXCLUDE: '(dist|coverage|node_modules)/.*'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG_FILE: .gitleaks.toml
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          LINTER_RULES_PATH: .github/linters
          MARKDOWN_CONFIG_FILE: .markdownlint.yaml
          PRETTIER_CONFIG_FILE: .prettierrc.json
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_CHECKOV: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_YAML_PRETTIER: false
          YAML_CONFIG_FILE: .yaml-lint.yml

      - name: Report lint findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Super-Linter findings'
            echo
            for f in super-linter-output/**/*.log super-linter-output/*.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              tail -c 8000 "$f"
              echo '```'
            done
            if [ -f super-linter-summary.md ]; then
              echo '### Summary'
              cat super-linter-summary.md
            fi
          } > /tmp/findings.md 2>/dev/null || true
          cat /tmp/findings.md >> "$GITHUB_STEP_SUMMARY" || true
          gh api "repos/${GITHUB_REPOSITORY}/issues/4/comments" \
            -f body="$(head -c 60000 /tmp/findings.md)" || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-report
          path: |
            super-linter-output/
            super-linter-summary.md
          if-no-files-found: warn
