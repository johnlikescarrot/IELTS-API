name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install the repository ESLint configuration dependencies
        run: npm ci

      - name: Run super-linter
        uses: super-linter/super-linter/slim@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          # Exclude root generated data, not src/data or test/data.
          FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|coverage|dist|super-linter-output)/|^(/github/workspace/)?data/'
          MULTI_STATUS: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          CREATE_LOG_FILE: true
          SAVE_SUPER_LINTER_OUTPUT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          # Languages enabled for this repository.
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Deliberately disabled: the code base is TypeScript-only and the
          # extraction scripts are standalone Python utilities with their own
          # formatting.
          # Linter configuration files.
          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          YAML_CONFIG_FILE: .yamllint.yml
          ESLINT_USE_FLAT_CONFIG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make container-generated diagnostics readable
        if: always()
        run: |
          for report in super-linter.log super-linter-output; do
            if [ -e "${report}" ]; then sudo chmod -R a+rX -- "${report}"; fi
          done

      - name: Annotate failed Super-Linter diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          log = Path('super-linter.log')
          if log.exists():
              text = log.read_text(errors='replace')[-48000:]
              for start in range(0, len(text), 8000):
                  chunk = text[start:start + 8000]
                  chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Super-Linter diagnostics::{chunk}')
          PYTHON

      - name: Preserve Super-Linter diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: super-linter-diagnostics
          path: |
            super-linter.log
            super-linter-output/
          retention-days: 7
          if-no-files-found: warn
