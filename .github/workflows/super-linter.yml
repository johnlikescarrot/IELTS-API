name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run super-linter
        id: super_linter
        uses: super-linter/super-linter/slim@v8.3.1
        env:
          # Write a per-linter report so a failure is diagnosable from the job
          # summary alone. Action logs are not always retrievable, and reading
          # 2,000 lines of console output to find one rule violation is not a
          # reasonable debugging loop.
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          DEFAULT_BRANCH: main
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          # The generated datasets are machine-written: never lint them.
          FILTER_REGEX_EXCLUDE: .*(data/|coverage/|dist/).*
          # Languages enabled for this repository.
          # TypeScript and JavaScript are linted by the repository's own flat
          # config in the `ci` workflow (`npm run lint --max-warnings 0`), against
          # an installed dependency tree. super-linter's bundled ESLint config is
          # not used for them: it runs in a container without `node_modules`, so
          # every `vitest` import is unresolvable, and its `eslint-plugin-n` rules
          # assume a different runtime baseline — flagging `fetch` as experimental
          # even though this package requires Node >= 20.19, where it is stable.
          # Enabling it here would report failures the code does not have.
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITLEAKS: true
          VALIDATE_CHECKOV: true
          # Linter configuration files, all kept in the repository root.
          LINTER_RULES_PATH: /
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          CHECKOV_FILE_NAME: .checkov.yml
          YAML_CONFIG_FILE: .yamllint.yml
          EDITORCONFIG_FILE_NAME: .ecrc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Surface the details in the job summary and the log when linting fails,
      # so the cause is visible without downloading the run archive.
      - name: Report linter findings
        if: ${{ failure() && steps.super_linter.outcome == 'failure' }}
        run: |
          set -euo pipefail
          summary="${{ github.workspace }}/super-linter-output/super-linter-summary.md"
          if [ -f "${summary}" ]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          find "${{ github.workspace }}/super-linter-output" -type f -name '*.log' -print0 2>/dev/null |
            while IFS= read -r -d '' logfile; do
              printf '\n===== %s =====\n' "${logfile##*/}"
              cat "${logfile}"
            done

      - name: Comment linter findings
        if: ${{ failure() && steps.super_linter.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out="${{ github.workspace }}/super-linter-output"
          body="$(mktemp)"
          {
            echo '### super-linter findings'
            echo '```text'
            cat "${out}/super-linter-summary.md" 2>/dev/null || true
            for f in "${out}"/super-linter/super-linter-parallel-std*; do
              case "${f}" in *CHECKOV*|*GITLEAKS*) continue ;; esac
              if [ -s "${f}" ]; then
                printf '\n===== %s =====\n' "${f##*/}"
                tail -c 4000 "${f}"
              fi
            done
            echo '```'
          } >> "${body}"
          gh pr comment "${PR_NUMBER}" --body-file "${body}" --repo "${GITHUB_REPOSITORY}"

      - name: Upload linter output
        if: ${{ failure() && steps.super_linter.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-output
          path: ${{ github.workspace }}/super-linter-output/
          if-no-files-found: ignore
          retention-days: 7
