name: super-linter

# super-linter runs on every push, every pull request, weekly, and on demand.
# It is the project's single source of truth for style across TypeScript,
# JavaScript, JSON, YAML, Markdown, Dockerfiles, shell scripts and workflows.
# The pinned image is invoked directly in RUN_LOCAL mode so the full report is
# always retrievable: it is posted onto the pull request when a lint fails.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Weekly, so that a linter release can never silently rot the codebase.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the report step explain a failing run right on the pull request.
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Lint the whole codebase
    runs-on: ubuntu-latest
    env:
      # Pinned image, same release the action wrapper would run.
      SL_IMAGE: ghcr.io/super-linter/super-linter:slim-v8.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run super-linter
        id: lint
        continue-on-error: true
        # The image runs in RUN_LOCAL mode so every finding is written to the
        # captured log (no reliance on the wrapper's action-only plumbing); the
        # next step surfaces that log on the pull request when a linter fails.
        run: |
          docker run --rm \
            -e RUN_LOCAL=true \
            -e DEFAULT_BRANCH=main \
            -e DEFAULT_WORKSPACE=/tmp/lint \
            -e VALIDATE_ALL_CODEBASE=true \
            -e FILTER_REGEX_EXCLUDE='.*(data/|coverage/|dist/).*' \
            -e LINTER_RULES_PATH=/tmp/lint \
            -e MARKDOWN_CONFIG_FILE=.markdown-lint.yml \
            -e YAML_CONFIG_FILE=.yamllint.yml \
            -e VALIDATE_JAVASCRIPT_ES=true \
            -e VALIDATE_TYPESCRIPT_ES=true \
            -e VALIDATE_JSON=true \
            -e VALIDATE_YAML=true \
            -e VALIDATE_MARKDOWN=true \
            -e VALIDATE_DOCKERFILE_HADOLINT=true \
            -e VALIDATE_BASH=true \
            -e VALIDATE_BASH_EXEC=true \
            -e VALIDATE_GITHUB_ACTIONS=true \
            -e VALIDATE_EDITORCONFIG=true \
            -e VALIDATE_ENV=true \
            -e VALIDATE_GITLEAKS=true \
            -e VALIDATE_CHECKOV=true \
            -v "$GITHUB_WORKSPACE":/tmp/lint \
            "$SL_IMAGE" 2>&1 | tee /tmp/super-linter.log
          exit "${PIPESTATUS[0]}"

      - name: Surface the failing lint output and fail the job
        if: steps.lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '%s\n' '## super-linter report' '' '```text'
            tail -c 58000 /tmp/super-linter.log
            printf '%s\n' '```'
          } > /tmp/report-comment.md
          if [ -n "${PR_NUMBER}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report-comment.md
          fi
          cat /tmp/report-comment.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
