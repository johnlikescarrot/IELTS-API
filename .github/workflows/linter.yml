name: Super-Linter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci

      - name: Lint (ESLint, project config)
        run: npm run lint

      - name: Format check (Prettier, project config)
        run: npm run format:check

      - name: Super-Linter
        uses: super-linter/super-linter@v6
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_GITLEAKS: false
          VALIDATE_EDITORCONFIG: false
          VALIDATE_DOCKERFILE: false
          LINTER_RULES_PATH: .
          CREATE_LOG_FILE: true
          LOG_LEVEL: DEBUG

      - name: Report Super-Linter diagnostics (temporary)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== super-linter.log ==="
          cat super-linter.log 2>/dev/null | tail -80 || echo "(no log file in workspace)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat super-linter.log 2>/dev/null | tail -80 || echo 'no log')"
          fi
