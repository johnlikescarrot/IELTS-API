name: Super-Linter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci

      - name: Lint (ESLint, project config)
        run: npm run lint

      - name: Format check (Prettier, project config)
        run: npm run format:check

      # Super-Linter is scoped to the linters that can run without the project's
      # node_modules and that have verified project rules in LINTER_RULES_PATH
      # (Markdown, YAML, JSON). ESLint/Prettier run through the project's own
      # footsteps above. The Test & Coverage workflow adds the build, type-check
      # and 100%-coverage gates. Container linters such as gitleaks and
      # editorconfig-checker are left disabled here.
      - name: Super-Linter
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_GITLEAKS: false
          VALIDATE_EDITORCONFIG: false
          VALIDATE_DOCKERFILE: false
          LINTER_RULES_PATH: .
