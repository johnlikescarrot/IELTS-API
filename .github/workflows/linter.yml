name: Super-Linter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci

      - name: Lint (ESLint, project config)
        run: npm run lint

      - name: Format check (Prettier, project config)
        run: npm run format:check

      # Super-Linter is scoped to linters that run without the project's
      # node_modules and have verified project rules in LINTER_RULES_PATH:
      # Markdown, YAML and JSON. ESLint and Prettier are run through the
      # project's own scripts above, and the Test & Coverage workflow adds the
      # build, type-check and 100%-coverage gates.
      - name: Super-Linter
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_GITLEAKS: false
          VALIDATE_EDITORCONFIG: false
          VALIDATE_DOCKERFILE: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_CSS_PRETTIER: false
          LINTER_RULES_PATH: .
