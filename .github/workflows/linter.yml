name: Super-Linter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci

      - name: Lint (ESLint, project config)
        run: npm run lint

      - name: Format check (Prettier, project config)
        run: npm run format:check

      # Super-Linter validates the linters that don't depend on the project's
      # node_modules (Markdown, YAML and JSON), using the project-specific rules
      # in LINTER_RULES_PATH. Setting VALIDATE_* true disables every unset
      # validator, so JS/TS ESLint and Prettier are deliberately left to the
      # project's own footsteps above. The Test & Coverage workflow adds the
      # build, type-check and 100%-coverage gates.
      - name: Super-Linter
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          LINTER_RULES_PATH: .
